name: Fetch Market Scan

on:
  schedule:
    # รันทุก 15 นาที (จันทร์-ศุกร์ ช่วง 03:00 - 09:45 UTC หรือ 10:00 - 16:45 เวลาไทย)
    - cron: '*/15 3-9 * * 1-5'
  workflow_dispatch: # เปิดให้กดรันมือได้

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        run: python fetch_scan.py  # หรือ scripts/fetch_scan.py ตามโฟลเดอร์จริง
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update scan data [skip ci]" || exit 0
          git push
