name: Market Update

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch calendar + market scan
        run: python scripts/fetch_scan.py

      - name: Keepalive (กัน GitHub ปิด schedule)
        run: |
          mkdir -p data
          date -u +%FT%TZ > data/heartbeat.txt

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลง"
          else
            git commit -m "data: update $(date -u +%F_%H:%M) UTC"
            git push
          fi
