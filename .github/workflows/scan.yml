name: Fetch Market Scan

on:
  schedule:
    - cron: "0,30 * * * *"      # ทุกนาทีที่ :00 และ :30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --upgrade yfinance pandas

      - name: Fetch data
        run: python scripts/fetch_scan.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan.json
          git diff --staged --quiet || git commit -m "chore: market scan $(date -u +%F_%H:%M)"
          git push
